<div id="loginScreen" class="screen active">

    <div class="auth-wrapper">

        <!-- SIGN IN SIDE -->

        <div class="login-side">

            <div class="login-logo">✦</div>

            <h1>Symbol Sudoku</h1>

            <p class="login-subtitle">
                Welcome back! Continue your Sudoku journey!
            </p>

            <h2>Sign In</h2>

            <div id="loginForm">

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter Username"
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter Password"
                >

                <button
                    type="button"
                    class="auth-button"
                    onclick="loginUser()"
                >
                    Sign In →
                </button>

            </div>

        </div>


        <!-- CREATE ACCOUNT SIDE -->

        <div class="signup-side">

            <div class="signup-icon">♟</div>

            <h2>New Here?</h2>

            <p>
                Create an account and start playing!
            </p>

            <h2 class="create-title">
                Create Account
            </h2>

            <div id="signupForm">

                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Choose Username"
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create Password"
                >

                <button
                    type="button"
                    class="auth-button"
                    onclick="signupUser()"
                >
                    Create Account →
                </button>

            </div>

            <div id="authMessage"></div>

        </div>

    </div>

</div>
