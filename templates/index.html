<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbol Sudoku</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <!-- LOGIN SCREEN -->
<div id="loginScreen" class="screen active">

    <div class="login-card">

        <h1>✨ Symbol Sudoku</h1>

        <p class="login-subtitle">
            Sign in and continue your Sudoku journey
        </p>

        <div class="auth-tabs">
            <button id="loginTab"
                    class="auth-tab active-tab"
                    onclick="showLogin()">
                Sign In
            </button>

            <button id="signupTab"
                    class="auth-tab"
                    onclick="showSignup()">
                Create Account
            </button>
        </div>

        <div id="authMessage"></div>

        <div id="loginForm">

            <input
                type="text"
                id="loginUsername"
                placeholder="Enter Username"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter Password"
            >

            <button class="auth-button" onclick="loginUser()">
                Sign In →
            </button>

        </div>


        <div id="signupForm" class="hidden">

            <input
                type="text"
                id="signupUsername"
                placeholder="Choose Username"
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Create Password"
            >

            <button class="auth-button" onclick="signupUser()">
                Create Account →
            </button>

        </div>

        <button class="theme-btn" onclick="toggleTheme()">
            🌙 / ☀ Theme
        </button>

    </div>

</div>

    <!-- START SCREEN -->
    <div id="startScreen" class="screen active">
        <div class="welcome-card">
            <h1>✨ Symbol Sudoku</h1>
            <p>Choose your board size and difficulty</p>

            <h2>Choose Board Size</h2>

            <div class="size-buttons">
                <button onclick="chooseSize(3)">3 × 3</button>
                <button onclick="chooseSize(4)">4 × 4</button>
                <button onclick="chooseSize(5)">5 × 5</button>
                <button onclick="chooseSize(6)">6 × 6</button>
            </div>

            <h2>Choose Difficulty</h2>

            <div class="level-buttons">
                <button class="easy" onclick="chooseLevel('Easy')">Easy</button>
                <button class="medium" onclick="chooseLevel('Medium')">Medium</button>
                <button class="hard" onclick="chooseLevel('Hard')">Hard</button>
            </div>

            <div id="selectionText" class="selection-text">
                Select board size and difficulty
            </div>

            <button id="enterBtn" class="enter-btn" onclick="startGame()" disabled>
                Enter the Game →
            </button>

            <button class="theme-btn" onclick="toggleTheme()">
                🌙 / ☀ Theme
            </button>
        </div>
    </div>


    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen">

        <div class="game-card">

            <div class="top-bar">
                <div>
                    <h1>✨ Symbol Sudoku</h1>
                    <p id="gameInfo"></p>
                </div>

                <button class="theme-btn small" onclick="toggleTheme()">
                    🌙 / ☀
                </button>
            </div>

            <div class="level-display">
                <span id="levelName">Easy</span>
                <span>Level <b id="levelNumber">1</b></span>
            </div>

            <div id="message" class="message"></div>

            <div class="board-area">
                <div id="sudokuBoard"></div>
            </div>

            <div class="choose-title">Choose a Symbol</div>

            <div id="symbolOptions" class="symbol-options"></div>

            <div class="controls">
                <button class="reset-btn" onclick="resetGame()">↻ Reset</button>

                <button class="new-btn" onclick="goToStart()">⚙ New Game</button>

                <button id="checkBtn" class="check-btn" onclick="checkGame()">
                    ✓ Check
                </button>

                <button id="nextBtn" class="next-btn hidden" onclick="nextLevel()">
                    Next Level →
                </button>
            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
