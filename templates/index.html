<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Symbol Sudoku</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <div class="card">

        <h1>🧩 Symbol Sudoku</h1>
        <p class="subtitle">Choose 9 symbols for your Sudoku game</p>

        <!-- SYMBOL SELECTION SCREEN -->
        <div id="selectionScreen">

            <h2>Choose Your Symbols</h2>

            <div id="symbolOptions" class="symbol-options"></div>

            <p id="selectedCount">Selected: 0 / 9</p>

            <button id="startButton" onclick="startGame()" disabled>
                Start Game
            </button>

        </div>


        <!-- GAME SCREEN -->
        <div id="gameScreen" style="display: none;">

            <div class="game-top">
                <div>
                    <h2>Symbol Sudoku</h2>
                    <p>Fill every row and column without repeating symbols!</p>
                </div>
            </div>

            <div id="gameBoard" class="board"></div>

            <div class="buttons">
                <button onclick="newGame()">New Game</button>
                <button onclick="backToSelection()">Change Symbols</button>
            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
